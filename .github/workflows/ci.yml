name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Linux build and logic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Install dependencies without native or Electron setup
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Internal logic tests
        run: npm run test:ci
      - name: Build
        run: npm run build
